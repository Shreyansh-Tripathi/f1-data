[project]
name = "f1data"
version = "0.1.0"
description = "Static F1 data pipeline: free sources to versioned JSON on GitHub Pages"
readme = "CLAUDE.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "numpy>=2.1",
    "pydantic>=2.9",
]

[project.scripts]
f1data = "f1data.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1data"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
