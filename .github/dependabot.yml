version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Python dependencies. The "uv" ecosystem updates pyproject.toml *and* uv.lock;
  # the plain "pip" ecosystem would leave uv.lock stale and fail `uv sync --locked`.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
