name: build

on:
  schedule:
    # Hourly; `f1data should-build` decides from the published calendar whether this run builds.
    - cron: "17 * * * *" # off the top of the hour, when GitHub delays or drops the most scheduled runs
  workflow_dispatch:
    inputs:
      year:
        description: Season (default current UTC year)
        type: string
        required: false
      round:
        description: Only this round (default all)
        type: string
        required: false
      session:
        description: Only this session
        type: choice
        options: [all, fp1, fp2, fp3, sq, sprint, q, race]
        default: all
      force:
        description: Rebuild sessions even if complete
        type: boolean
        default: false
      poll:
        description: Keep polling while a round is in progress (ignored with round or session)
        type: boolean
        default: false
      poll_budget_minutes:
        description: How long a polling run polls before dispatching its successor
        type: string
        default: "330"

permissions:
  contents: write
  actions: write # a polling run dispatches its successor

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # a polling run lasts up to 5.5 h; GitHub's job limit is 6 h
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runs start cold: restore the published tree so complete sessions are skipped.
      - name: Check out gh-pages into site/
        run: |
          mkdir -p site
          if git fetch --depth 1 origin gh-pages; then
            git archive FETCH_HEAD | tar -x -C site
          fi

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - run: uv sync --locked

      # Scheduled runs build inside a round's window (first session to 72 h after the last), when the
      # last full build is over 24 h old, or before the season is published. Manual runs always build.
      # While a round is in progress (`f1data should-poll`) the run keeps polling and, when its budget runs out,
      # dispatches its successor: GitHub starts the hourly schedule only a few times a day.
      - name: Decide whether to build and poll
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          POLL_INPUT: ${{ inputs.poll }}
          ROUND: ${{ inputs.round }}
          SESSION: ${{ inputs.session }}
        run: |
          year=$(date -u +%Y)
          if [ "$EVENT" = workflow_dispatch ]; then
            decision=true
          else
            decision=$(uv run f1data should-build --year "$year") # a crash fails the step
            [[ "$decision" =~ ^(true|false)$ ]] || { echo "unexpected: $decision"; exit 1; }
          fi
          poll=false
          if [ "$decision" = true ] && { [ "$EVENT" != workflow_dispatch ] || [ "$POLL_INPUT" = true ]; } \
            && [ -z "$ROUND" ] && { [ -z "$SESSION" ] || [ "$SESSION" = all ]; }; then
            read -r poll _ <<<"$(uv run f1data should-poll --year "$year")"
            [[ "$poll" =~ ^(true|false)$ ]] || { echo "unexpected: $poll"; exit 1; }
          fi
          echo "build=$decision" >> "$GITHUB_OUTPUT"
          echo "poll=$poll" >> "$GITHUB_OUTPUT"

      - name: Restore HTTP cache
        if: steps.decide.outputs.build == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: f1data-http-${{ github.run_id }}
          restore-keys: f1data-http-

      # Builds, then publishes to gh-pages when manifest.json changed; repeats while polling.
      - name: Build and publish
        if: steps.decide.outputs.build == 'true'
        env:
          YEAR: ${{ inputs.year }}
          ROUND: ${{ inputs.round }}
          SESSION: ${{ inputs.session }}
          FORCE: ${{ inputs.force }}
          POLL: ${{ steps.decide.outputs.poll }}
          POLL_BUDGET_MINUTES: ${{ inputs.poll_budget_minutes || '330' }}
          GITHUB_TOKEN: ${{ github.token }} # api.github.com only: F1DB release lookup, dispatching the next run
        run: |
          YEAR="${YEAR:-$(date -u +%Y)}"
          [[ "$YEAR" =~ ^[0-9]{4}$ ]] || { echo "bad year: $YEAR"; exit 2; }
          export YEAR
          args=(--year "$YEAR")
          if [ -n "$ROUND" ]; then
            [[ "$ROUND" =~ ^[0-9]+$ ]] || { echo "bad round: $ROUND"; exit 2; }
            args+=(--round "$ROUND")
          fi
          if [ -n "$SESSION" ] && [ "$SESSION" != all ]; then args+=(--session "$SESSION"); fi
          if [ "$FORCE" = true ]; then args+=(--force); fi
          [[ "$POLL_BUDGET_MINUTES" =~ ^[0-9]+$ ]] && [ "$POLL_BUDGET_MINUTES" -le 330 ] \
            || { echo "bad poll_budget_minutes: $POLL_BUDGET_MINUTES"; exit 2; }
          export POLL_BUDGET_S=$((POLL_BUDGET_MINUTES * 60))
          .github/scripts/build-and-publish.sh "${args[@]}"
